[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "certbot-dns-tencent"
version = "2.0.0"
description = "腾讯云 DNSPod 插件，用于 Certbot 的 DNS-01 验证"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "tiyee", email = "tiyee@live.com"}]
keywords = ["certbot", "dns-01", "acme", "tencent", "dnspod"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "certbot>=3,<4; python_version < '3.10'",
    "certbot>=3,<6; python_version >= '3.10' and python_version < '3.14'",
    # josepy 1.x used by Certbot 3 cannot import on Python 3.14 (PEP 649).
    "certbot>=5,<6; python_version >= '3.14'",
    "acme>=3,<6",
    # Certbot 3/josepy 1 still needs APIs removed in PyOpenSSL 25.
    "pyopenssl<25; python_version < '3.10'",
    "tencentcloud-sdk-python-dnspod>=3.1.130,<4",
    "importlib-metadata>=4.6,<9; python_version < '3.10'",
]

[project.urls]
Homepage = "https://github.com/iDigimon/certbot-dns-tencent"
Repository = "https://github.com/iDigimon/certbot-dns-tencent"
Issues = "https://github.com/iDigimon/certbot-dns-tencent/issues"

[project.entry-points."certbot.plugins"]
dns-tencent = "certbot_dns_tencent.dns_tencent:Authenticator"

[dependency-groups]
dev = [
    "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1",
    "tox>=4.28,<5", "tox-uv>=1.26,<2", "twine>=6,<7",
    "tomli>=2,<3; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["certbot_dns_tencent"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
include = ["/certbot_dns_tencent", "/tests", "/scripts", "/README.md", "/CHANGELOG.md", "/AGENTS.md", "/LICENSE", "/pyproject.toml", "/tox.ini", "/uv.lock"]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os" = {msg = "Use from certbot.compat import os for cross-platform compatibility."}
